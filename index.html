<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>장면 하나</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #fbfbf9;
  --ink: #1d2224;
  --muted: #80888a;
  --rule: #dfe3e2;
  --accent: #55736d;
  --serif: "Gowun Dodum", "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
  --hand: "Nanum Pen Script", "Gowun Dodum", cursive;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #14181a;
    --ink: #e7eae9;
    --muted: #8a9395;
    --rule: #2a3234;
    --accent: #8fb0a8;
  }
}
:root[data-theme="dark"] {
  --paper: #14181a;
  --ink: #e7eae9;
  --muted: #8a9395;
  --rule: #2a3234;
  --accent: #8fb0a8;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); }
body {
  font-family: var(--serif);
  font-size: 19px;
  line-height: 1.85;
  -webkit-font-smoothing: antialiased;
  word-break: keep-all;
  overflow-x: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 2px; }

.view { display: none; }
.view.on { display: block; }

/* ---------- 도입 ---------- */
#intro {
  min-height: 100vh;
  min-height: 100dvh;
  position: relative;
}
.intro-tap {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; justify-content: center;
  padding: 0 32px;
  max-width: 520px; margin: 0 auto;
  text-align: left;
  cursor: pointer;
}
.intro-text {
  font-size: clamp(24px, 6.4vw, 30px);
  line-height: 1.9;
  margin: 0;
  white-space: pre-line;
  opacity: 0;
  transition: opacity 0.9s ease;
}
.intro-text.show { opacity: 1; }
.intro-go {
  margin-top: 56px;
  align-self: flex-start;
  padding: 12px 0;
  border-bottom: 1px solid var(--ink);
  font-size: 18px;
  opacity: 0;
  transition: opacity 0.9s ease 0.5s;
  pointer-events: none;
}
.intro-go.show { opacity: 1; pointer-events: auto; }
.dots {
  position: absolute; left: 32px; bottom: calc(40px + env(safe-area-inset-bottom, 0px));
  display: flex; gap: 8px;
}
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--rule); transition: background .4s; }
.dots i.on { background: var(--muted); }

/* ---------- 카드 ---------- */
.card { max-width: 520px; margin: 0 auto; padding: 0 32px; }
.card-inner { opacity: 1; transition: opacity .5s ease; }
.card-inner.fade { opacity: 0; }

.block {
  margin: 0; white-space: pre-line;
  font-family: var(--hand);
  font-size: 27px; line-height: 1.7;
  -webkit-text-stroke: 0.014em var(--paper); /* 글자 가장자리를 종이색으로 깎아 가늘게 */
}
.scene-wrap {
  min-height: 78vh; min-height: 78dvh;
  display: flex; flex-direction: column; justify-content: center;
}
.scene {
  font-size: clamp(34px, 9vw, 42px);
  line-height: 1.6;
}
.scroll-hint {
  margin-top: 56px;
  width: 1px; height: 36px; background: var(--rule);
}
.view-text { margin-top: 24px; }
.try {
  margin-top: 72px;
  padding-left: 20px;
  border-left: 2px solid var(--accent);
}
.back { margin-top: 72px; color: var(--muted); }

.mark { display: block; margin-top: 64px; width: 56px; height: auto; color: var(--wash, var(--accent)); opacity: .9; }
.ref { margin-top: 56px; border-top: 1px solid var(--rule); padding-top: 20px; }
.ref summary {
  list-style: none; cursor: pointer;
  font-size: 15px; color: var(--muted); line-height: 1.7;
}
.ref summary::-webkit-details-marker { display: none; }
.ref summary::after { content: " ›"; }
.ref[open] summary::after { content: " ⌃"; }
.ref-body { font-size: 15px; color: var(--muted); line-height: 1.85; margin-top: 12px; }
.ref-body p { margin: 0 0 8px; }

.actions {
  margin-top: 96px; padding-bottom: 80px;
  display: flex; gap: 12px;
}
.actions button {
  flex: 1;
  padding: 16px 12px;
  border: 1px solid var(--rule);
  border-radius: 6px;
  font-size: 17px;
}
.actions button:hover { border-color: var(--muted); }


/* ---------- 종이 결과 번짐 ---------- */
.scene-wrap { position: relative; isolation: isolate; }
.scene-wrap::before {
  content: ""; position: absolute; z-index: -1; pointer-events: none;
  left: calc(var(--wx, 50%) - 45%); top: calc(var(--wy, 40%) - 30%);
  width: 100%; height: 55%;
  background: radial-gradient(ellipse at center, color-mix(in srgb, var(--wash, var(--accent)) 20%, transparent), transparent 72%);
}

/* ---------- 저장 이미지 ---------- */
#saveOverlay {
  position: fixed; inset: 0; z-index: 10;
  background: color-mix(in srgb, var(--paper) 94%, transparent);
  display: none; flex-direction: column; align-items: center; justify-content: center;
  padding: 24px; gap: 20px;
  padding-top: calc(24px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
}
#saveOverlay.on { display: flex; }
#saveOverlay img { max-width: 100%; max-height: 66vh; border: 1px solid var(--rule); }
#saveOverlay p { margin: 0; font-size: 16px; color: var(--muted); text-align: center; }
#saveOverlay button { padding: 12px 28px; border: 1px solid var(--rule); border-radius: 6px; font-size: 17px; }

@media (prefers-reduced-motion: reduce) {
  .intro-text, .intro-go, .card-inner { transition: none; }
}
</style>
</head>
<body>

<!-- 도입 -->
<main id="intro" class="view on">
  <div class="intro-tap" id="introTap" role="button" tabindex="0" aria-label="다음">
    <p class="intro-text" id="introText"></p>
    <button class="intro-go" id="introGo" type="button">첫 장면 보기</button>
  </div>
  <div class="dots" aria-hidden="true"><i class="on"></i><i></i></div>
</main>

<!-- 카드 -->
<main id="cardView" class="view">
  <div class="card">
    <div class="card-inner" id="cardInner"></div>
  </div>
</main>

<!-- 저장 이미지 -->
<div id="saveOverlay" role="dialog" aria-label="카드 이미지">
  <img id="saveImg" alt="저장할 카드 이미지">
  <p>이미지를 길게 눌러 사진첩에 저장해요</p>
  <button type="button" id="saveClose">닫기</button>
</div>

  {"id": "rice-smell", "parts": ["밥솥 뚜껑을 열 때\n김과 함께 올라오는 냄새를 맡아봐요.", "냄새에서\n따뜻한 흰색이 떠올라요.", "밥은 냄새로\n먼저 지어져요."], "ref": {"title": "장클로드 엘레나를 알고 이렇게 생각했어요", "body": ["장클로드 엘레나(1947–)는 프랑스 조향사예요. 에르메스의 전속 조향사로 일하며 『향수 일기』를 썼어요.", "2004년부터 에르메스의 향수를 만들었다고 해요.", "밥솥 뚜껑을 열 때 올라오는 냄새에서 따뜻한 흰색을 떠올려 봐도 되겠다 싶었어요.", "참고한 곳: 레이디경향 인터뷰"]}},
  {"id": "nail-clipper", "parts": ["손톱깎이를 쥐고\n손잡이를 천천히 눌러봐요.", "살짝 누르는데\n단단한 손톱이 잘려요.", "손잡이가 내 힘을\n크게 만들어줘요."], "ref": {"title": "박제가를 알고 이렇게 생각했어요", "body": ["박제가(1750–)는 조선 후기 실학자예요. 청나라를 다녀와 쓴 『북학의』로 유명해요.", "수레와 벽돌 같은 일상의 도구를 눈여겨보고, 쓰임을 편리하게 하는 일이 삶을 두텁게 한다고 말했어요.", "손톱깎이 손잡이가 내 힘을 키워주는 것도 도구가 하는 일이겠다 싶었어요.", "참고한 곳: 『북학의』 소개(리디북스, 머니투데이)"]}},
  {"id": "dark-ceiling", "parts": ["자기 전에 불을 끄고\n천장을 올려다봐요.", "처음엔 깜깜하다가\n천장 모서리가 보이기 시작해요.", "어둠은 아주 천천히\n자기가 가진 모습을 드러내죠."], "ref": null},
  {"id": "cloud-shadow", "parts": ["구름이 많은 날\n길 위의 그림자를 봐요.", "밝았다가 어두워졌다가\n한 번씩 지나가요.", "구름이 땅을\n한 번 쓸고 가요."], "ref": null},
  {"id": "puddle", "parts": ["비 온 뒤 물웅덩이를\n내려다봐요.", "하늘과 건물이\n거꾸로 담겨 있어요.", "발밑에\n하늘이 한 조각 깔려 있어요."], "ref": {"title": "앙리 카르티에브레송을 알고 이렇게 생각했어요", "body": ["앙리 카르티에브레송(1908–2004)은 프랑스 사진가예요. 사진집 『결정적 순간』(1952)으로 유명해요.", "물웅덩이를 뛰어넘는 남자가 반대로 비친 모습과 함께 찍힌 〈생라자르 역 뒤〉(1932)로 알려졌어요.", "웅덩이를 내려다보면 하늘과 건물이 거꾸로 담긴 것도 그런 장면이겠다 싶었어요.", "참고한 곳: 요코하마 미술관 소장품 해설"]}},
  {"id": "shoe-heel", "parts": ["벗은 신발을 뒤집어\n뒤축을 봐요.", "어느 한쪽이\n더 닳아 있어요.", "신발이 내 걸음을\n먼저 알고 있어요."], "ref": {"title": "야나기 무네요시를 알고 이렇게 생각했어요", "body": ["야나기 무네요시(1889–1961)는 일본의 사상가예요. 이름 없는 사람들이 매일 쓰는 물건에서 아름다움을 찾은 것으로 유명해요.", "조선의 평범한 밥사발에 감탄한 글도 남겼다고 전해져요.", "신발 뒤축이 한쪽만 닳은 것도 내 걸음이 만든 모양이구나 싶었어요.", "참고한 곳: 야나기 무네요시 전시 자료(주일한국문화원)"]}},
  {"id": "monitor", "parts": ["꺼진 모니터를\n한참 들여다봐요.", "까만 화면 위에\n내 방이 비쳐 있어요.", "꺼져 있을 때만\n거울이 돼요."], "ref": {"title": "장필립 토생을 알고 이렇게 생각했어요", "body": ["장필립 토생(Jean-Philippe Toussaint, 1957–)은 벨기에 소설가예요. 첫 소설 『욕실』(1985)로 알려졌어요.", "욕실을 거처로 삼은 남자의 이야기로, 인물의 마음을 설명하지 않고 세부를 거리를 두고 본다는 평을 받아요.", "꺼진 모니터에 비친 내 방을 가만히 보는 것도 그렇게 거리를 두고 보는 일이겠다 싶었어요.", "참고한 곳: 베를린 문학 페스티벌 작가 소개"]}},
  {"id": "moon-cloud", "parts": ["구름 사이로 달이 지나갈 때\n구름의 가장자리를 봐요.", "달은 가려졌는데\n구름 끝이 밝아져요.", "구름 가장자리에\n달빛이 걸려 있어요."], "ref": {"title": "요시다 겐코를 알고 이렇게 생각했어요", "body": ["요시다 겐코는 일본 중세의 수필가예요. 『쓰레즈레구사』로 유명해요.", "꽃이 피기 직전이나 진 뒤처럼 완벽하지 않은 때에도 볼만한 것이 있다고 썼어요.", "구름이 반쯤 가린 달의 가장자리를 보는 것도 그런 일이겠다 싶었어요.", "참고한 곳: 『쓰레즈레구사』"]}},
  {"id": "tree-rings", "parts": ["베어진 나무의 그루터기를\n가까이 들여다봐요.", "둥근 줄이 겹겹이\n가운데를 감싸고 있어요.", "줄 하나가\n나무의 한 해예요."], "ref": {"title": "이덕무를 알고 이렇게 생각했어요", "body": ["이덕무(1741–1793)는 조선 후기 문인이에요. 『이목구심서』로 유명해요.", "눈앞의 작은 것도 놓치지 않고 적은 사람이에요.", "그루터기의 줄 하나가 나무의 한 해라는 걸 세어 보는 것도 그렇게 보는 일이겠다 싶었어요.", "참고한 곳: 『이목구심서』"]}},
  {"id": "footsteps", "parts": ["걷다가 발소리를\n한번 들어봐요.", "아스팔트에서 타일로 올라서면\n소리가 달라져요.", "내 발은 그대로인데\n소리는 바닥이 정해요."], "ref": {"title": "에릭 사티를 알고 이렇게 생각했어요", "body": ["에릭 사티(1866–1925)는 프랑스 작곡가예요. 듣지 않아도 되는 음악, ‘가구 음악’으로 유명해요.", "1920년 파리 화랑 연주회의 프로그램에는 음악에 신경 쓰지 말고 막간에 음악이 없는 것처럼 행동해 달라는 문장이 있었어요.", "내가 걷는 발소리도 바닥이 정해주는 배경 소리처럼 들어봐도 되겠다 싶었어요.", "참고한 곳: 소닉필드 가구 음악 소개"]}},
  {"id": "box", "parts": ["다 쓴 종이 상자를\n바닥에 세워놓고 봐요.", "모서리 하나가\n끝까지 각을 지키고 있어요.", "쓰임이 끝나도\n네모는 그대로예요."], "ref": {"title": "루이스 칸을 알고 이렇게 생각했어요", "body": ["루이스 칸(1901–1974)은 미국 건축가예요. 벽돌에게 무엇을 원하느냐고 묻던 건축가로 유명해요.", "1973년 강연에서 재료를 존중해야 한다는 이야기를 벽돌과의 대화로 풀어 말했어요.", "다 쓴 종이 상자도 끝까지 각을 지키는 걸 보면 상자에게도 제 모양이 있겠다 싶었어요.", "참고한 곳: Yatzer, Architecture Today 소개 글"]}},
  {"id": "bicycles", "parts": ["길가에 세워둔 자전거들을\n한 대씩 봐요.", "핸들이 꺾인 쪽이\n제각각이에요.", "한 대는 고개를 숙이고\n한 대는 먼 데를 봐요."], "ref": {"title": "로베르트 발저를 알고 이렇게 생각했어요", "body": ["로베르트 발저는 스위스 작가예요. 걷는 이야기를 쓴 소설 『산책』으로 유명해요.", "글이 안 풀리는 방에서 나와 마을을 걸으며, 한가해 보이는 산책이 사실은 일하는 시간이라고 말해요.", "길가의 자전거들이 서 있는 모양이 제각각인 것도 걷다 보면 눈에 걸리겠다 싶었어요.", "참고한 곳: 『산책』 서평(Three Percent, The Rumpus)"]}},
  {"id": "wilted-flower", "parts": ["화병에 꽂아둔 꽃의\n꽃잎 끝을 봐요.", "가장자리부터\n색이 옅어지고 말려 있어요.", "시들기 시작한 자리가\n꽃의 마지막 둘레예요."], "ref": {"title": "요시다 겐코를 알고 이렇게 생각했어요", "body": ["요시다 겐코는 일본 중세의 수필가예요. 『쓰레즈레구사』로 유명해요.", "꽃이 피기 직전이나 진 뒤처럼 완벽하지 않은 때에도 볼만한 것이 있다고 썼어요.", "시들기 시작한 꽃잎 끝을 보는 것도 그렇게 보는 일이겠다 싶었어요.", "참고한 곳: 『쓰레즈레구사』"]}},
  {"id": "mirror", "parts": ["거울 앞에서\n가르마나 점이 있는 쪽을 봐요.", "남이 찍어준 내 사진에서도\n같은 쪽을 찾아봐요.", "둘은 서로\n반대편에 있어요."], "ref": {"title": "이상을 알고 이렇게 생각했어요", "body": ["이상(1910–1937)은 한국의 시인이자 소설가예요. 거울을 소재로 한 시 「거울」(1933)로도 유명해요.", "거울 속의 나는 나와 반대지만 꽤 닮았다는 내용이에요. 이 시가 실린 『가톨릭청년』은 정지용이 편집했어요.", "내 얼굴도 거울과 사진에서 반대로 보인다는 걸 확인해 보고 싶었어요.", "참고한 곳: 이상 「거울」 소개 글(브런치)"]}},
  {"id": "winter-tree", "parts": ["잎이 다 떨어진 나무를\n올려다봐요.", "가지 사이로\n하늘이 조각조각 보여요.", "나뭇잎이 가렸던 건\n하늘이었어요."], "ref": {"title": "알베르토 자코메티를 알고 이렇게 생각했어요", "body": ["알베르토 자코메티(1901–1966)는 스위스 조각가예요. 가늘고 길쭉한 인물상으로 유명해요.", "인물과 공간의 관계에 관심을 두고, 가늘게 덜어낸 인물로 공간을 보여줬다고 해요.", "잎이 다 떨어진 나무의 가지 사이로 하늘이 보이는 것도 비슷한 일이겠다 싶었어요.", "참고한 곳: 바이엘러 재단 자코메티 연보"]}},
  {"id": "phone-light", "parts": ["불을 끈 방에서\n핸드폰 화면 빛을 손에 비춰봐요.", "손가락 마디만\n또렷하게 보여요.", "빛이 닿은 자리는\n어둠이 떠나간 자리예요."], "ref": {"title": "브라사이를 알고 이렇게 생각했어요", "body": ["브라사이(1899–1984)는 헝가리 출신 프랑스 사진가예요. 밤의 파리를 찍은 『파리의 밤』으로 유명해요.", "어두운 골목에서 꽃집 창이나 젖은 포석 같은 세부만 드러날 정도의 빛으로 찍었다고 소개돼요.", "불 끈 방에서 핸드폰 빛이 닿은 손만 또렷한 것도 그런 장면이겠다 싶었어요.", "참고한 곳: 시카고미술관 작품 해설, 브리태니커"]}},
  {"id": "coffee-hands", "parts": ["카페에서 커피를 내리는 걸\n얼굴 말고 손으로 봐요.", "주전자를 쥔 손목이\n물줄기를 굵혔다 줄여요.", "맛은 표정이 아니라\n손끝에서 나와요."], "ref": {"title": "김홍도를 알고 이렇게 생각했어요", "body": ["김홍도(1745–1806 이후)는 조선 후기 화가예요. 씨름과 서당 같은 서민의 일상을 그린 『단원풍속도첩』으로 유명해요.", "국립중앙박물관은 그의 풍속화가 인물의 몸짓과 표정만으로 장면의 긴장과 리듬을 만든다고 소개해요.", "커피 내리는 걸 얼굴 말고 손으로 보면 몸짓이 보이겠다 싶었어요.", "참고한 곳: 국립중앙박물관 단원 김홍도 전시 소개"]}},
  {"id": "branch", "parts": ["창밖 나뭇가지 하나를\n아침에 한 번 봐요.", "저녁에 다시 보면\n같은 가지가 달라 보여요.", "가지는 그대로인데\n빛이 다녀갔어요."], "ref": {"title": "폴 세잔을 알고 이렇게 생각했어요", "body": ["폴 세잔(1839–1906)은 프랑스 화가예요. 같은 산과 사과를 여러 번 그린 것으로 유명해요.", "생트빅투아르산을 여러 번 그렸고, 피카소는 세잔을 자신의 유일한 스승이라고 불렀다고 해요.", "창밖 나뭇가지를 아침과 저녁에 다시 보면 같은 가지도 달라 보이겠다 싶었어요.", "참고한 곳: 서울신문 세잔·르누아르 전시 기사"]}},
  {"id": "let-sound-pass", "parts": ["창밖으로 차가 지나가요.\n소리를 잡지 말고 흘려보내봐요.", "귀를 모으지 않으면\n방 안 소리가 한꺼번에 들려요.", "소리는 가만히 두면\n배경이 돼요."], "ref": {"title": "에릭 사티를 알고 이렇게 생각했어요", "body": ["에릭 사티(1866–1925)는 프랑스 작곡가예요. ‘가구 음악’으로 유명해요.", "가구 음악은 사람들이 대화하고 움직이는 동안 배경으로 흐르도록 쓴 음악이에요.", "창밖 차 소리를 잡지 않고 배경으로 흘려보내도 되겠다 싶었어요.", "참고한 곳: 캐롤라인 포터 가구 음악 논문 초록"]}},
  {"id": "building", "parts": ["길 건너 건물을 보며\n장식은 지우고 윤곽만 남겨봐요.", "네모 몇 개가\n쌓여 있어요.", "아이가 그린 집이\n틀리지 않았어요."], "ref": {"title": "장욱진을 알고 이렇게 생각했어요", "body": ["장욱진(1917–1990)은 한국 화가예요. 작은 화면에 까치, 나무, 집을 단순하게 그린 것으로 유명해요.", "서울신문은 그가 작은 화면에 가장 보편적인 이미지를 가장 단순하게 표현했다고 소개해요.", "길 건너 건물도 장식을 지우고 윤곽만 보면 아이가 그린 집처럼 보이겠다 싶었어요.", "참고한 곳: 서울신문 양주시립장욱진미술관 기사"]}},
  {"id": "fridge-names", "parts": ["냉장고 문을 열고\n안에 있는 걸 하나씩 이름으로 불러봐요.", "두부, 대파, 계란.\n불러주면 한 칸씩 또렷해져요.", "이름을 알고 나면\n물건이 아니라 식구예요."], "ref": {"title": "백석을 알고 이렇게 생각했어요", "body": ["백석(1912–)은 한국 시인이에요. 1936년 시집 『사슴』을 100부만 찍어 낸 것으로 유명해요.", "평북 사투리와 옛말을 살려 우리 전통 생활을 썼다고 소개돼요.", "냉장고 속 물건을 이름으로 하나씩 불러보면 달라 보이겠다 싶었어요.", "참고한 곳: 『사슴』 소개(리디북스)"]}},
  {"id": "stairs-below", "parts": ["계단을 올라가다 말고\n아래에서 올려다봐요.", "아래서 보는 계단은\n층마다 모서리만 이어져요.", "같은 계단이\n처음 보는 길이에요."], "ref": {"title": "비비안 마이어를 알고 이렇게 생각했어요", "body": ["비비안 마이어(1926–2009)는 미국 사진가예요. 보모로 일하며 찍은 사진으로 유명해요.", "내려다보며 찍는 롤라이플렉스 카메라로 도시를 걸으며 찍었어요.", "계단도 아래에서 올려다보면 늘 보던 계단이 낯설게 보이겠다 싶었어요.", "참고한 곳: 브리태니커, Mother Jones 소개"]}},
  {"id": "receipt", "parts": ["주머니에서 나온\n구겨진 영수증을 펴봐요.", "얼마였는지 적힌 숫자가\n이제 아무것도 증명하지 않아요.", "쓸모가 끝난 자리에\n종이만 남았어요."], "ref": {"title": "장자를 알고 이렇게 생각했어요", "body": ["장자는 중국 옛 사상가예요. 쓸모를 따지지 않는 이야기로 유명해요.", "『장자』에는 쓸모없다고 버려진 나무가 오히려 그늘이 되어 준다는 이야기가 나와요.", "구겨진 영수증도 쓸모가 끝난 뒤 종이로 남는 걸 보면 비슷한 생각이 들었어요.", "참고한 곳: 『장자』 「소요유」"]}},
  {"id": "empty-chair", "parts": ["방금 누가 일어난\n빈 의자를 봐요.", "방석이 아직\n조금 눌려 있어요.", "사람은 갔는데\n자리는 아직 앉아 있어요."], "ref": {"title": "에드워드 호퍼를 알고 이렇게 생각했어요", "body": ["에드워드 호퍼(1882–1967)는 미국 화가예요. 밤의 식당을 그린 〈Nighthawks〉(1942)로 유명해요.", "밝게 불 켜진 식당과 어두운 거리의 대비를 그렸고, 완성 직후 시카고미술관이 샀다고 해요.", "방금 누가 일어난 빈 의자에도 사람이 머문 흔적이 남아 있겠다 싶었어요.", "참고한 곳: 시카고미술관 〈Nighthawks〉 해설"]}},
  {"id": "night-light", "parts": ["밤 창밖을 내다보며\n움직이지 않는 불빛 하나를 골라봐요.", "그 곁으로 차들이\n하나씩 지나가요.", "흔들리지 않는 불빛 하나가\n차들이 지나는 밤을 이야기해요."], "ref": {"title": "마이클 케나를 알고 이렇게 생각했어요", "body": ["마이클 케나(1953–)는 영국 사진가예요. 새벽이나 밤에 오래 노출해 찍은 흑백 풍경 사진으로 유명해요.", "설명보다 암시를 좋아한다고 말하며 하이쿠에 빗댔어요.", "밤 창밖에서 움직이지 않는 불빛 하나를 오래 보는 것도 비슷한 일이겠다 싶었어요.", "참고한 곳: 포토뉴올리언스 전시 소개"]}},
  {"id": "hidden-sound", "parts": ["조용한 방에서\n숨겨진 소리 하나를 찾아봐요.", "귀를 기울이면\n낮고 일정한 소리가 깔려 있어요.", "조용하다고 느낀 방이\n사실은 소리로 가득했어요."], "ref": {"title": "브라이언 이노를 알고 이렇게 생각했어요", "body": ["브라이언 이노(1948–)는 영국 음악가예요. 《Music for Airports》(1978 무렵)로 ‘앰비언트 음악’을 알렸어요.", "속지 글에서 앰비언트 음악은 여러 수준의 듣기를 받아들이고, 흥미로운 만큼 무시할 수도 있어야 한다고 썼어요.", "조용한 방에도 늘 깔려 있는 소리가 하나쯤 있겠다 싶었어요.", "참고한 곳: 스미스소니언 매거진 《Music for Airports》 소개"]}},
  {"id": "coffee-smell", "parts": ["갓 내린 커피에서\n올라오는 김을 따라가봐요.", "컵은 작은데\n향은 방 끝까지 가요.", "작은 컵의 커피 향은\n온 방을 채울 수 있어요."], "ref": null},
  {"id": "morning-water", "parts": ["아침에 일어나 첫 물 한 잔을\n천천히 마셔봐요.", "물이 목을 지나\n몸이 깨어나는 걸 느껴요.", "몸이 제일 먼저\n하루의 시작을 알아요."], "ref": {"title": "세이 쇼나곤을 알고 이렇게 생각했어요", "body": ["세이 쇼나곤은 헤이안 시대 일본의 궁녀예요. 수필집 『마쿠라노소시(베갯머리 서책)』로 유명해요.", "계절마다 좋은 때를 적었고, ‘봄은 동틀 무렵’으로 시작하는 대목이 알려졌어요.", "아침에 마시는 첫 물 한 잔도 나에게 맞는 한 시각이겠다 싶었어요.", "참고한 곳: 『마쿠라노소시』 소개(리디북스)"]}},
  {"id": "hand-span", "parts": ["손을 쫙 펴서\n책상 가장자리를 한 뼘씩 재봐요.", "몇 뼘인지 알고 나면\n매일 쓰던 책상이 새로 보여요.", "내 손이\n이 방의 자예요."], "ref": {"title": "마사오카 시키를 알고 이렇게 생각했어요", "body": ["마사오카 시키(1867–1902)는 일본의 하이쿠 시인이에요. 수필 『병상육척』으로 유명해요.", "1902년 5월부터 9월까지 쓴 글로, 좁은 자리 안에서 눈에 닿는 것을 적었다고 해요.", "내 손 한 뼘으로 책상을 재보는 것도 손이 닿는 만큼의 세상을 보는 일이겠다 싶었어요.", "참고한 곳: 『병상육척』 소개(리디북스)"]}},
  {"id": "night-shadow", "parts": ["밤길에서 바닥에 진\n나뭇가지 그림자를 봐요.", "바람이 불면\n그림자가 물풀처럼 흔들려요.", "불빛이 고인 자리에\n물풀이 자라요."], "ref": {"title": "소식을 알고 이렇게 생각했어요", "body": ["소식(소동파)은 중국 송나라 시인이에요. 달 밝은 밤에 잠이 안 와 친구를 찾아 나선 짧은 글로 유명해요.", "그 글에서 달빛이 든 뜰을 물이 고인 것 같다고 하고, 물풀처럼 보이는 건 나무 그림자라고 썼어요.", "나도 밤길 바닥에 진 가지 그림자가 물풀처럼 흔들리는 걸 보고 싶었어요.", "참고한 곳: 「기승천사야유」 소개(Sixth Tone)"]}},
  {"id": "high-view", "parts": ["높은 데서\n길을 내려다봐요.", "길은 선 하나,\n사람은 점 몇 개예요.", "점들이 움직이고서야\n사람인 걸 알아요."], "ref": {"title": "장대를 알고 이렇게 생각했어요", "body": ["장대는 중국 명나라 말의 문인이에요. 눈 온 날 호수에 배를 타고 나간 짧은 글로 유명해요.", "그 글에서 호수에 보이는 것을 둑은 한 획, 정자는 한 점, 내 배는 겨자씨 한 알로 그렸어요.", "나도 늘 걷던 길을 높은 데서 내려다보면 선 하나와 점 몇 개로 줄어들겠다 싶었어요.", "참고한 곳: 『도암몽억』 「호심정간설」 소개(Danny Yee 서평)"]}},
  {"id": "mosquito", "parts": ["여름밤 귓가에\n모기 소리가 들려요.", "쫓기 전에 잠깐\n하늘을 나는 학이라고 생각해봐요.", "윙 하는 소리가\n날갯짓 소리가 돼요."], "tryIdx": 1, "ref": {"title": "심복을 알고 이렇게 생각했어요", "body": ["심복은 중국 청나라 사람이에요. 일상의 작은 즐거움을 쓴 자서전 『부생육기』로 유명해요.", "어릴 때 여름밤 모기떼 소리를 들으면 학이 하늘에서 춤추는 모습을 상상했고, 정말 수백 마리의 학으로 보였다고 해요.", "나도 귓가의 모기 소리를 학의 날갯짓 소리로 바꿔 들어보고 싶었어요.", "참고한 곳: 『부생육기』 소개(위키백과, 타이완 리뷰)"]}},
  {"id": "laundry-sky", "parts": ["빨래를 널다가\n고개를 한 번 들어봐요.", "창 너머 먼 하늘이\n한 장 걸려 있어요.", "일하는 손 옆으로\n구름이 따라와요."], "ref": {"title": "도연명을 알고 이렇게 생각했어요", "body": ["도연명은 중국 옛 시인이에요. 관직을 내려놓고 시골로 돌아가 국화를 가꾸며 지낸 것으로 유명해요.", "시에서 국화를 따다 문득 눈에 들어온 먼 산 이야기를 썼어요.", "나도 빨래를 널다 문득 눈에 들어오는 하늘을 보고 싶었어요.", "참고한 곳: 『음주』 소개(브리태니커, 오벌린 미술관 해설)"]}},
  {"id": "empty-stairs", "parts": ["아무도 안 보이는 계단에 서서\n귀를 열어봐요.", "어딘가에서 문 닫히는 소리,\n벽에는 창에서 든 빛이 한 조각 앉아 있어요.", "사람은 안 보여도\n소리와 빛은 거기에 있어요."], "ref": {"title": "왕유를 알고 이렇게 생각했어요", "body": ["왕유는 중국 당나라 시인이에요. 그림도 그린 사람으로, 별장 근처 스무 곳을 읊은 시들로 유명해요.", "시 「녹시」에서 사람은 보이지 않는 빈 산에 말소리만 울리고, 되돌아온 햇빛이 이끼 위를 다시 비춘다고 썼어요.", "나도 아무도 없는 계단에서 소리와 빛이 먼저 와 있는 걸 보고 싶었어요.", "참고한 곳: 『망천집』 소개(JSTOR Daily, Harper's)"]}},
  {"id": "leaf-rain", "parts": ["아침에 창문을 열고\n나뭇잎을 봐요.", "잎마다 물방울이 맺혀\n고개를 살짝 숙이고 있어요.", "밤새 내린 비 못 떠나고\n잎에 남아 있어요."], "ref": {"title": "두보를 알고 이렇게 생각했어요", "body": ["두보는 중국 당나라 시인이에요. 농사를 지으며 지낸 청두에서 쓴 봄밤의 비 시로 유명해요.", "시에서 좋은 비는 밤에 바람을 따라 몰래 들어와 소리 없이 만물을 적신다고 했어요.", "나도 비 온 다음 날 아침, 잎에 남은 물방울에서 밤새 내린 비를 알아보고 싶었어요.", "참고한 곳: 「춘야희우」 소개(차이나 데일리 영어점진)"]}},
  {"id": "tomato", "parts": ["방울토마토 꼭지를 떼고\n꼭지 쪽에 코를 대봐요.", "열매는 새콤달콤한데\n꼭지에서는 풀 냄새가 나요.", "그 작은 한 알에\n밭 내음도 같이 왔어요."], "ref": {"title": "왕쩡치를 알고 이렇게 생각했어요", "body": ["왕쩡치는 중국 현대 작가예요. 일상의 작은 것을 쓴 산문으로 유명해요.", "산문집 소개글에서 사람과 풍경, 풀과 벌레, 과일과 음식까지 두루 쓴다고 직접 밝혔어요.", "나도 토마토 꼭지의 풀 냄새를 맡으며 열매가 자란 밭을 떠올려 보고 싶었어요.", "참고한 곳: 산문집 『포교집』 소개(CUHK Renditions, JD)"]}},
  {"id": "night-walk", "parts": ["매일 지나던 집 앞 길을\n밤에 한 번 걸어봐요.", "낮엔 못 보던 불빛이\n길 위에 번져 있어요.", "불빛이 닿아 만든\n새 길로 걸어가요."], "ref": {"title": "주쯔칭을 알고 이렇게 생각했어요", "body": ["주쯔칭은 중국 현대 산문을 대표하는 작가예요. 달빛 아래 연못을 걸은 짧은 글로 유명해요.", "그 글에서 어수선하던 며칠 끝에 매일 지나던 연못이 떠올라 밤에 걸었다고 썼어요.", "나도 매일 지나던 길을 밤에 다시 걸어 보고 싶었어요.", "참고한 곳: 「연못의 달빛」 번역(Paper Republic)"]}},
  {"id": "morning-dust", "parts": ["아침에 일어나기 전\n커튼 틈으로 든 빛줄기를 봐요.", "빛 속에서 먼지가\n느리게 떠다니고 있어요.", "조용한 방이\n살아나고 있어요."], "ref": {"title": "린위탕을 알고 이렇게 생각했어요", "body": ["린위탕은 중국의 작가예요. 영어로 쓴 『생활의 발견』이 미국에서 베스트셀러가 되어 유명해요.", "책에는 한가함의 중요성, 차와 우정, 침대 위에서 사는 법 같은 이야기가 들어 있어요.", "나도 아침에 일어나기 전 느리게 떠다니는 먼지를 한가하게 바라보고 싶었어요.", "참고한 곳: 『생활의 발견』 소개(윌슨 쿼털리, Philosophy Now)"]}},
  {"id": "old-tiles", "parts": ["오래된 길의 바닥 타일을\n한 장씩 내려다봐요.", "깨진 모서리, 닳은 한가운데,\n메운 자국까지 제각각이에요.", "지나간 시간이\n한 장 한 장 쌓여 있어요."], "ref": {"title": "왕슈를 알고 이렇게 생각했어요", "body": ["왕슈는 중국 건축가예요. 중국인으로는 처음 프리츠커상을 받았어요.", "철거된 건물의 기와와 벽돌을 다시 써서, 질감이 살아 있는 건물을 지었어요.", "나도 닳고 깨진 바닥 타일을 보며, 내가 지나온 시간도 이렇게 제각각이겠다 싶었어요.", "참고한 곳: 왕슈 소개(브리태니커, 프리츠커상)"]}}
];

/* ============ 카드별 색과 표식 ============ */
var TONES = {
  air: "#7d93a3", sound: "#9a8aaa", light: "#c2a45a", water: "#5f8fa8",
  earth: "#9b7b5c", green: "#6f9473", night: "#5d6a9a", town: "#a58080", warm: "#b88a62"
};
var CARD_TONE = {
  "wind":"air","frame":"town","trace":"town","far-sound":"sound","feet":"earth","rain-line":"water",
  "look-up":"air","usual-thing":"warm","first-smell":"warm","crack-plant":"green","same-spot":"light",
  "handwriting":"town","far-window":"air","night-room":"night","errand-route":"town","closed-shutter":"town",
  "oldest-thing":"warm","bird-unseen":"green","hesse-color":"light","hesse-soil":"earth","goethe-leaves":"green",
  "goethe-stone":"earth","goethe-cloud":"air","goethe-shadow":"light","goethe-tide":"water","hesse-walk":"green",
  "hesse-river":"water","silence-after":"sound","walk-together":"warm","same-direction":"warm",
  "hesse-draw":"warm","hesse-alone":"night","hesse-line":"night","after-swallow":"warm","season-smell":"air","wash-hands":"water","door-handle":"warm","steam-first":"warm","kettle-sound":"warm","night-window":"night","drip-music":"sound","puddle-sky":"water","chew-rice":"warm","book-smell":"warm","look-down":"air",
"bread-hole":"warm","fan":"air","door-knob":"warm","handrail":"town","rain-smell":"water","apple":"warm","bus-window":"town","pot-water":"water","laundry-sleeve":"air","soap":"light","sunset-room":"light","eyes-closed-room":"night","tangerine":"warm","breath-fog":"air","milk":"light","drawer":"night","crosswalk-wait":"town","pot-leaf":"green","shoes-door":"earth","cutting-board":"earth","rice":"warm","knee-height":"earth","foggy-window":"water","bread-bite":"warm","book-spine":"light","lamp-shade":"light","tea-steam":"air","sun-patch":"light","pocket-items":"town","bag":"earth","rice-smell":"warm","nail-clipper":"warm","dark-ceiling":"night","cloud-shadow":"air","puddle":"water","shoe-heel":"earth","monitor":"night","moon-cloud":"night","tree-rings":"green","footsteps":"sound","box":"earth","bicycles":"town","wilted-flower":"green","mirror":"town","winter-tree":"green","phone-light":"night","coffee-hands":"warm","branch":"light","let-sound-pass":"sound","building":"town","fridge-names":"warm","stairs-below":"town","receipt":"town","empty-chair":"warm","night-light":"night","hidden-sound":"sound","coffee-smell":"warm","morning-water":"water","hand-span":"warm",
"night-shadow":"night","high-view":"town","mosquito":"sound","laundry-sky":"air","empty-stairs":"sound","leaf-rain":"water","tomato":"green","night-walk":"night","morning-dust":"light","old-tiles":"earth"
};
function toneOf(id) { return TONES[CARD_TONE[id]] || "#55736d"; }

function seedOf(str) {
  var h = 2166136261;
  for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function rng(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function markSpec(id) {
  var seed = seedOf(id), r = rng(seed), v = seed % 6;
  var j = function () { return r() * 2 - 1; };
  var f = function (n) { return Math.round(n * 10) / 10; };
  if (v === 0) return { paths: ["M2 " + f(11 + j()) + " C 12 " + f(6 + 2 * j()) + ", 26 " + f(14 + 2 * j()) + ", " + f(38 + 4 * j()) + " 8"], dots: [[44.5, 4.5, 1.9]] };
  if (v === 1) return { paths: ["M8 8 C 18 " + f(3 + j()) + ", 30 " + f(12 + j()) + ", " + f(45 + 2 * j()) + " 6"], dots: [[3, 12.5, 1.9]] };
  if (v === 2) return { paths: ["M2 6 C 14 3, 24 8, " + f(30 + 4 * j()) + " 5", "M10 12 C 22 9, 30 14, " + f(44 + 2 * j()) + " 11"], dots: [] };
  if (v === 3) return { paths: ["M2 " + f(13 + j()) + " C 14 12, 28 " + f(8 + j()) + ", 43 3"], dots: [[46, 2.6, 1.9]] };
  if (v === 4) return { paths: ["M2 9 C 8 " + f(3 + j()) + ", 14 " + f(3 + j()) + ", 20 9 S 32 " + f(15 + j()) + ", 38 9 S 44 5, 46 6"], dots: [] };
  return { paths: ["M2 10 C 12 " + f(6 + j()) + ", 24 " + f(12 + j()) + ", 34 8"], dots: [[39, 7, 1.3], [43, 6.5, 1.1], [46.5, 6, 0.9]] };
}
function markSvg(id) {
  var m = markSpec(id);
  return '<svg class="mark" viewBox="0 0 48 16" aria-hidden="true">' +
    m.paths.map(function (d) { return '<path d="' + d + '" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>'; }).join("") +
    m.dots.map(function (c) { return '<circle cx="' + c[0] + '" cy="' + c[1] + '" r="' + c[2] + '" fill="currentColor"/>'; }).join("") +
    '</svg>';
}

/* ============ 도입 ============ */
var introStep = 0;
var introText = document.getElementById("introText");
var introGo = document.getElementById("introGo");
var introTap = document.getElementById("introTap");
var dots = document.querySelectorAll(".dots i");

function showIntro(i) {
  introStep = i;
  introText.classList.remove("show");
  introGo.classList.remove("show");
  setTimeout(function () {
    introText.textContent = INTRO[i];
    introText.classList.add("show");
    if (i === INTRO.length - 1) introGo.classList.add("show");
    for (var d = 0; d < dots.length; d++) dots[d].classList.toggle("on", d === i);
  }, i === 0 ? 100 : 450);
}

function advanceIntro(e) {
  if (e && e.target === introGo) return;
  if (introStep < INTRO.length - 1) showIntro(introStep + 1);
}
introTap.addEventListener("click", advanceIntro);
introTap.addEventListener("keydown", function (e) {
  if (e.target !== introTap) return;
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); advanceIntro(); }
});
function markVisited() {
  try { localStorage.setItem("scene-visited", "1"); } catch (e) {}
}
introGo.addEventListener("click", function (e) {
  e.stopPropagation();
  markVisited();
  bag = shuffle(CARDS.slice(1)); // 첫 카드(바람)를 뺀 나머지를 섞어 둔다
  openCard(CARDS[0]); // 처음 온 사람의 첫 카드는 고정
});

/* ============ 카드 ============ */
var cardInner = document.getElementById("cardInner");
var current = null;
var bag = [];

function shuffle(a) {
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function nextCard() {
  if (bag.length === 0) {
    bag = shuffle(CARDS.slice());
    // 방금 본 카드가 연달아 나오지 않게
    if (current && bag.length > 1 && bag[bag.length - 1].id === current.id) {
      bag.unshift(bag.pop());
    }
  }
  return bag.pop();
}

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function bodyHtml(c) {
  if (c.parts) {
    var last = c.parts.length - 1;
    return '<div class="scene-wrap"><p class="block scene">' + esc(c.parts[0]) + '</p><div class="scroll-hint" aria-hidden="true"></div></div>' +
      c.parts.slice(1).map(function (p, i) {
        var idx = i + 1;
        var cls = idx === last ? "back" : (c.tryIdx === idx ? "try" : "view-text");
        return '<p class="block ' + cls + '">' + esc(p) + '</p>';
      }).join("");
  }
  return '<div class="scene-wrap"><p class="block scene">' + esc(c.scene) + '</p><div class="scroll-hint" aria-hidden="true"></div></div>' +
    (c.view ? '<p class="block view-text">' + esc(c.view) + '</p>' : '') +
    '<p class="block try">' + esc(c.tryIt) + '</p>' +
    '<p class="block back">' + esc(c.back) + '</p>';
}

function renderCard(c) {
  var refHtml = "";
  if (c.ref) {
    refHtml =
      '<details class="ref"><summary>' + esc(c.ref.title) + '</summary>' +
      '<div class="ref-body">' +
      c.ref.body.map(function (p) { return "<p>" + esc(p) + "</p>"; }).join("") +
      "</div></details>";
  }
  c._wx = 25 + Math.random() * 50;
  c._wy = 25 + Math.random() * 35;
  cardInner.style.setProperty("--wx", c._wx + "%");
  cardInner.style.setProperty("--wy", c._wy + "%");
  cardInner.style.setProperty("--wash", toneOf(c.id));
  cardInner.innerHTML =
    bodyHtml(c) +
    markSvg(c.id) +
    refHtml +
    '<div class="actions">' +
      '<button type="button" id="btnNext">다른 장면</button>' +
      '<button type="button" id="btnSave">이 카드 저장</button>' +
    '</div>';
  document.getElementById("btnNext").addEventListener("click", function () { openCard(nextCard(), true); });
  document.getElementById("btnSave").addEventListener("click", saveCard);
}

function openCard(c, withFade) {
  var show = function () {
    current = c;
    // 고정 첫 카드는 가방에서 뺀다
    bag = bag.filter(function (x) { return x.id !== c.id; });
    document.getElementById("intro").classList.remove("on");
    document.getElementById("cardView").classList.add("on");
    document.body.classList.add("on-card");
    renderCard(c);
    window.scrollTo(0, 0);
    requestAnimationFrame(function () { cardInner.classList.remove("fade"); });
  };
  if (withFade) {
    cardInner.classList.add("fade");
    setTimeout(show, 350);
  } else {
    cardInner.classList.add("fade");
    show();
  }
}

/* ============ 이미지 저장 ============ */
function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

function wrapLine(ctx, text, maxW) {
  var out = [], line = "";
  for (var i = 0; i < text.length; i++) {
    var t = line + text[i];
    if (ctx.measureText(t).width > maxW && line) { out.push(line); line = text[i]; }
    else line = t;
  }
  if (line) out.push(line);
  return out;
}

function saveCard() {
  if (!current) return;
  var fontReady = (document.fonts && document.fonts.load)
    ? Promise.all([
        document.fonts.load('40px "Nanum Pen Script"', current.parts ? current.parts.join("") : [current.scene, current.view, current.tryIt, current.back].join("")),
        document.fonts.load('26px "Gowun Dodum"', "장면 하나")
      ]).catch(function () {})
    : Promise.resolve();
  fontReady.then(function () {
    var W = 1080, H = 1350, pad = 110, maxW = W - pad * 2;
    var cv = document.createElement("canvas");
    cv.width = W; cv.height = H;
    var ctx = cv.getContext("2d");
    var famUI = '"Gowun Dodum", "Noto Sans KR", "Apple SD Gothic Neo", sans-serif';
    var famHand = '"Nanum Pen Script", "Gowun Dodum", cursive';
    var paper = cssVar("--paper") || "#fbfbf9";
    var ink = cssVar("--ink") || "#1d2224";
    var muted = cssVar("--muted") || "#80888a";
    var accent = cssVar("--accent") || "#55736d";

    ctx.fillStyle = paper; ctx.fillRect(0, 0, W, H);
    var gx = W * ((current._wx || 50) / 100), gy = H * 0.26;
    var g = ctx.createRadialGradient(gx, gy, 0, gx, gy, 520);
    g.addColorStop(0, toneOf(current.id) + "38"); g.addColorStop(1, toneOf(current.id) + "00");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.textBaseline = "top";

    var y = 170;
    function draw(text, size, color, lh, indent) {
      ctx.font = size + "px " + famHand;
      ctx.fillStyle = color;
      var rows = [];
      text.split("\n").forEach(function (l) { rows = rows.concat(wrapLine(ctx, l, maxW - (indent || 0))); });
      rows.forEach(function (r) {
        ctx.fillStyle = color; ctx.fillText(r, pad + (indent || 0), y);
        ctx.strokeStyle = paper; ctx.lineWidth = size * 0.014; ctx.lineJoin = "round";
        ctx.strokeText(r, pad + (indent || 0), y); // 종이색 테두리로 깎아 가늘게
        y += lh;
      });
    }

    if (current.parts) {
      var lastI = current.parts.length - 1;
      draw(current.parts[0], 68, ink, 108);
      for (var pi = 1; pi <= lastI; pi++) {
        y += (pi === 1 ? 70 : 60);
        if (pi === lastI) { draw(current.parts[pi], 50, muted, 82); }
        else if (current.tryIdx === pi) {
          var yt = y;
          draw(current.parts[pi], 50, ink, 82, 32);
          ctx.fillStyle = accent; ctx.fillRect(pad, yt + 6, 4, y - yt - 16);
        } else { draw(current.parts[pi], 50, ink, 82); }
      }
    } else {
    draw(current.scene, 68, ink, 108);
    y += 70;
    draw(current.view, 50, ink, 82);
    y += 60;
    var y0 = y;
    draw(current.tryIt, 50, ink, 82, 32);
    ctx.fillStyle = accent; ctx.fillRect(pad, y0 + 6, 4, y - y0 - 16);
    y += 60;
    draw(current.back, 50, muted, 82);
    }
    // 카드별 표식
    var ms = markSpec(current.id);
    ctx.save();
    ctx.translate(pad, y + 36);
    ctx.scale(2.6, 2.6);
    ctx.globalAlpha = 0.9;
    ctx.strokeStyle = toneOf(current.id); ctx.fillStyle = toneOf(current.id);
    ctx.lineWidth = 1.6; ctx.lineCap = "round";
    ms.paths.forEach(function (d) { ctx.stroke(new Path2D(d)); });
    ms.dots.forEach(function (c) { ctx.beginPath(); ctx.arc(c[0], c[1], c[2], 0, Math.PI * 2); ctx.fill(); });
    ctx.restore();

    ctx.font = "26px " + famUI; ctx.fillStyle = muted;
    ctx.fillText("장면 하나", pad, H - 110);

    var img = document.getElementById("saveImg");
    img.src = cv.toDataURL("image/png");
    document.getElementById("saveOverlay").classList.add("on");
  });
}
document.getElementById("saveClose").addEventListener("click", function () {
  document.getElementById("saveOverlay").classList.remove("on");
});

/* ============ 시작 ============ */
var visited = false;
try { visited = localStorage.getItem("scene-visited") === "1"; } catch (e) {}
if (visited) {
  // 다시 온 사람: 도입 없이 바로, 매번 새로 섞은 순서의 카드
  bag = shuffle(CARDS.slice());
  openCard(bag.pop());
} else {
  showIntro(0);
}
</script>
